<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordres de Mission — Oral Lieutenant 1re Classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --smoke-black:#161210;
    --panel:#221b17;
    --panel-2:#2c2420;
    --ember:#e8542e;
    --ember-bright:#ff7a3d;
    --amber:#f2a340;
    --brass:#c9a15a;
    --paper:#f3ead9;
    --paper-dim:#cbbfa9;
    --line: rgba(201,161,90,0.28);
    --blue:#3d6fa8;
    --blue-bright:#5b8fc9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 800px 500px at 50% -10%, rgba(232,84,46,0.16), transparent 60%),
      radial-gradient(ellipse 600px 400px at 90% 100%, rgba(242,163,64,0.08), transparent 60%),
      var(--smoke-black);
    color:var(--paper);
    font-family:'Oswald', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
    overflow-x:hidden;
  }

  .embers{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .ember-particle{
    position:absolute; bottom:-10px; border-radius:50%;
    background:var(--ember-bright);
    box-shadow:0 0 6px 2px rgba(255,122,61,0.7);
    animation: rise linear infinite;
    opacity:0.7;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0.8;}
    90%{opacity:0.5;}
    100%{ transform:translateY(-110vh) translateX(var(--drift,20px)); opacity:0;}
  }

  header{ position:relative; z-index:1; text-align:center; margin-bottom:6px; }
  .eyebrow{
    font-family:'Oswald',sans-serif; letter-spacing:0.35em; font-size:12px;
    color:var(--brass); text-transform:uppercase; margin-bottom:6px;
  }
  h1{
    font-family:'Bebas Neue', sans-serif; font-size:clamp(34px,7vw,58px);
    letter-spacing:0.04em; margin:0; color:var(--paper);
    text-shadow: 0 0 18px rgba(232,84,46,0.35);
  }
  h1 span{color:var(--ember-bright);}
  .subtitle{
    color:var(--paper-dim); font-size:14px; margin-top:8px;
    font-family:'Source Serif 4', serif; font-style:italic;
  }

  .deckzone{
    position:relative; z-index:1; width:100%; max-width:480px;
    display:flex; flex-direction:column; align-items:center; margin-top:22px;
  }

  .filterbar{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
    margin-bottom:18px; max-width:420px;
  }
  .filter-chip{
    font-family:'Oswald'; font-size:10.5px; letter-spacing:0.06em;
    text-transform:uppercase; padding:6px 10px; border-radius:20px;
    border:1px solid var(--line); background:transparent; color:var(--paper-dim);
    cursor:pointer; transition:all .15s ease;
  }
  .filter-chip.active{ background:var(--ember); border-color:var(--ember); color:#fff2e4;}

  .stage{ position:relative; width:100%; max-width:380px; aspect-ratio: 5/7; perspective: 1600px; }

  .stack-deco{ position:absolute; inset:0; border-radius:18px; background:linear-gradient(155deg,var(--panel-2),var(--panel)); border:1px solid var(--line); }
  .stack-deco.d1{ transform:translate(6px,8px) rotate(2deg); opacity:0.55;}
  .stack-deco.d2{ transform:translate(12px,16px) rotate(4deg); opacity:0.3;}

  .card{ position:absolute; inset:0; border-radius:18px; cursor:pointer; transform-style:preserve-3d; transition: transform 0.7s cubic-bezier(.22,.9,.28,1); }
  .card.flipped{ transform: rotateY(180deg); }
  .card.drawing{ animation: drawpulse 0.5s ease; }
  @keyframes drawpulse{
    0%{ transform: translateY(0) scale(1) rotateY(0);}
    30%{ transform: translateY(-14px) scale(1.03) rotateY(0);}
    100%{ transform: translateY(0) scale(1) rotateY(180deg);}
  }

  .face{ position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; display:flex; flex-direction:column; overflow:hidden; box-shadow: 0 18px 40px -12px rgba(0,0,0,0.6), 0 0 0 1px var(--line); }

  .back{
    background: repeating-linear-gradient(135deg, rgba(201,161,90,0.05) 0px, rgba(201,161,90,0.05) 2px, transparent 2px, transparent 14px),
      linear-gradient(160deg,#2c2420,#1c1613 60%, #241c17);
    display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
  }
  .back-badge{ width:64%; aspect-ratio:1; border-radius:50%; border:2px solid var(--brass); display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
  .back-badge::before{ content:""; position:absolute; inset:8px; border-radius:50%; border:1px dashed rgba(201,161,90,0.5); }
  .back-badge .flame{ font-size:34px; margin-bottom:6px; filter:drop-shadow(0 0 8px rgba(232,84,46,0.6));}
  .back-badge .btxt{ font-family:'Bebas Neue'; letter-spacing:0.15em; font-size:15px; color:var(--brass); text-align:center; line-height:1.3; padding:0 8px;}
  .back-hint{ position:absolute; bottom:18px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:0.2em; color:var(--paper-dim); text-transform:uppercase; }

  .front{
    transform: rotateY(180deg);
    background: linear-gradient(175deg, var(--paper), #e9ddc4 92%);
    color:#241c17; padding:20px 18px 14px; justify-content:flex-start;
  }
  .front::before{ content:""; position:absolute; inset:6px; border:1px solid rgba(36,28,23,0.18); border-radius:12px; pointer-events:none; }
  .front-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .theme-tag{
    font-family:'Oswald'; font-weight:600; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:#fff; background:var(--ember); padding:5px 9px; border-radius:4px 4px 4px 0; max-width:72%;
  }
  .theme-tag.terr{ background:var(--blue); }
  .theme-tag.qcm{ background:#6d5a3f; }
  .card-no{ font-family:'Bebas Neue'; font-size:12px; color:#8a7a5f; letter-spacing:0.1em; white-space:nowrap; }
  .acro-seal{
    align-self:center; margin:4px auto 10px; width:92px; height:92px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--amber), var(--ember) 70%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--ember), inset 0 2px 8px rgba(0,0,0,0.25);
    flex-shrink:0;
  }
  .acro-seal.terr{ background: radial-gradient(circle at 35% 30%, var(--blue-bright), var(--blue) 70%); box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--blue), inset 0 2px 8px rgba(0,0,0,0.25); }
  .acro-seal span{
    font-family:'Bebas Neue'; font-size: clamp(12px, 4.4vw, 18px); color:#fff2e4;
    letter-spacing:0.02em; text-align:center; line-height:1.05; padding:0 6px; text-shadow: 0 2px 3px rgba(0,0,0,0.35);
  }
  .question{
    font-family:'Source Serif 4', serif; font-size:14.5px; line-height:1.38; text-align:center;
    color:#241c17; padding:0 2px; flex:1; display:flex; align-items:center; justify-content:center;
    overflow-y:auto;
  }
  .front-bottom{ text-align:center; font-family:'Oswald'; font-size:9.5px; letter-spacing:0.16em; color:#8a7a5f; text-transform:uppercase; padding-top:6px; border-top:1px solid rgba(36,28,23,0.15); }

  .controls{ display:flex; gap:10px; margin-top:22px; z-index:1; position:relative; flex-wrap:wrap; justify-content:center; }
  button{
    font-family:'Oswald'; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; font-size:12.5px;
    border-radius:8px; border:none; cursor:pointer; padding:12px 18px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity .2s ease;
  }
  button:active{ transform:scale(0.96); }
  .btn-draw{ background: linear-gradient(180deg,var(--ember-bright),var(--ember)); color:#fff2e4; box-shadow: 0 8px 20px -6px rgba(232,84,46,0.55); }
  .btn-draw:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none;}
  .btn-answer{ background: linear-gradient(180deg,var(--blue-bright),var(--blue)); color:#fff2e4; box-shadow: 0 8px 20px -6px rgba(61,111,168,0.55); }
  .btn-answer:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; }
  .btn-reset{ background:transparent; color:var(--brass); border:1px solid var(--line); }

  .answer-box{
    z-index:1; position:relative; margin-top:16px; width:100%; max-width:380px;
    background:linear-gradient(160deg,#22344a,#1a2838); border:1px solid rgba(91,143,201,0.35);
    border-radius:14px; padding:16px 18px; box-shadow:0 12px 28px -10px rgba(0,0,0,0.5);
  }
  .answer-label{ font-family:'Bebas Neue'; letter-spacing:0.15em; font-size:14px; color:var(--blue-bright); margin-bottom:6px; }
  .answer-text{ font-family:'Source Serif 4', serif; font-size:14.5px; line-height:1.5; color:var(--paper); }

  .meter{ margin-top:16px; z-index:1; position:relative; display:flex; align-items:center; gap:10px; font-size:12px; letter-spacing:0.12em; color:var(--paper-dim); text-transform:uppercase; }
  .meter-bar{ width:180px; height:6px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .meter-fill{ height:100%; background: linear-gradient(90deg,var(--amber),var(--ember)); transition: width 0.4s ease; }

  .empty-msg{ z-index:1; position:relative; margin-top:20px; text-align:center; color:var(--paper-dim); font-family:'Source Serif 4', serif; font-style:italic; font-size:14px; max-width:320px; }

  @media (max-width:400px){
    .question{ font-size:13.5px; }
    .acro-seal{ width:80px; height:80px;}
  }
</style>
</head>
<body>

<div class="embers" id="embers"></div>

<header>
  <div class="eyebrow">DAZ Academy &middot; Oral officier</div>
  <h1>PREPA <span>SUNSHINE</span> ;-)</h1>
  <div class="subtitle">100 cartes à tirer au sort — pompier &amp; culture territoriale</div>
</header>

<div class="deckzone">

  <div class="filterbar" id="filterbar"></div>

  <div class="stage" id="stage">
    <div class="stack-deco d2"></div>
    <div class="stack-deco d1"></div>
    <div class="card" id="card">
      <div class="face back">
        <div class="back-badge">
          <div class="flame">🔥</div>
          <div class="btxt">STIS &middot; SDIS<br>OFFICIER</div>
        </div>
        <div class="back-hint">Tirer la carte</div>
      </div>
      <div class="face front">
        <div class="front-top">
          <div class="theme-tag" id="themeTag">THÈME</div>
          <div class="card-no" id="cardNo">01/100</div>
        </div>
        <div class="acro-seal" id="acroSeal"><span id="acroTxt">ACR</span></div>
        <div class="question" id="questionTxt">Question</div>
        <div class="front-bottom">Répondez à voix haute</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-draw" id="drawBtn">Tirer une carte</button>
    <button class="btn-answer" id="answerBtn" disabled>Voir la réponse</button>
    <button class="btn-reset" id="resetBtn">Rebattre le jeu</button>
  </div>

  <div class="answer-box" id="answerBox" style="display:none;">
    <div class="answer-label">Réponse</div>
    <div class="answer-text" id="answerText"></div>
  </div>

  <div class="meter">
    <span id="meterLabel">100 cartes restantes</span>
    <div class="meter-bar"><div class="meter-fill" id="meterFill" style="width:100%"></div></div>
  </div>

  <div class="empty-msg" id="emptyMsg" style="display:none;">
    Le jeu est épuisé. Rebattez pour reprendre une nouvelle garde.
  </div>
</div>

<script>
// ===================== CARTES POMPIER (30) =====================
const POMPIER = [
{theme:"FPT", acro:"PPCR", q:"Pouvez-vous m'expliquer ce que signifie PPCR et quel était son objectif ?",
 a:"Protocole Parcours Professionnels, Carrières et Rémunérations (2016) : simplifier le statut, revaloriser les grilles indiciaires et favoriser la mobilité entre les 3 versants de la fonction publique."},
{theme:"FPT", acro:"NBI", q:"Que signifie la NBI et dans quel cas un agent peut-il en bénéficier ?",
 a:"Nouvelle Bonification Indiciaire : points d'indice majoré supplémentaires pour un emploi comportant une responsabilité ou une technicité particulière, attribués à l'emploi occupé (et non au grade)."},
{theme:"FPT", acro:"CST", q:"Quelles instances représentatives du personnel connaissez-vous dans la FPT ?",
 a:"Le CST (Comité Social Territorial, ex-CT+CHSCT) pour les conditions de travail, et la CAP pour les questions individuelles (avancement, discipline)."},
{theme:"FPT", acro:"DÉONTO", q:"Quelles sont vos obligations déontologiques en tant que fonctionnaire ?",
 a:"Neutralité, impartialité, dignité, probité, intégrité, obligation de réserve, secret et discrétion professionnels, obéissance hiérarchique sauf ordre manifestement illégal (loi du 13 juillet 1983)."},
{theme:"FPT", acro:"DISCIP", q:"Vous devez engager une procédure disciplinaire contre un agent sous vos ordres : quelles étapes suivez-vous ?",
 a:"Constat des faits, entretien préalable, saisine du conseil de discipline pour les sanctions des 2e à 4e groupes, respect des droits de la défense, décision motivée et proportionnée."},
{theme:"FPT", acro:"STAG", q:"Quelle différence faites-vous entre un fonctionnaire stagiaire et un fonctionnaire titulaire ?",
 a:"Le stagiaire est en période probatoire, sans garantie de l'emploi ; le titulaire bénéficie de la garantie de l'emploi propre au statut."},
{theme:"FPT", acro:"AVANC", q:"Par quelles voies pouvez-vous accéder au grade de lieutenant de 1re classe ?",
 a:"Avancement au choix, après inscription sur liste d'aptitude, sous conditions d'ancienneté en lieutenant 2e classe et réussite à l'examen professionnel."},

{theme:"Sécurité civile", acro:"SDACR", q:"Quel est, selon vous, le rôle du SDACR dans l'organisation d'un SDIS ?",
 a:"Document stratégique qui dresse l'inventaire des risques du territoire et fixe les objectifs de couverture par les moyens du SDIS."},
{theme:"Sécurité civile", acro:"STIS", q:"Vous êtes muté d'un SDIS vers un STIS en collectivité d'outre-mer : quelles différences organisationnelles rencontrez-vous ?",
 a:"Rattachement institutionnel différent (collectivité unique et non département), doctrine et moyens adaptés au contexte insulaire (risques cycloniques, éloignement des renforts)."},
{theme:"Sécurité civile", acro:"COS", q:"En tant que premier officier sur les lieux, à partir de quand endossez-vous la fonction de COS ?",
 a:"Dès votre arrivée sur les lieux si vous êtes le premier officier/gradé qualifié ; la fonction se transmet ensuite avec la montée en puissance du commandement."},
{theme:"Sécurité civile", acro:"NRBC", q:"Vous êtes alerté pour une fuite de produit chimique en zone industrielle : comment structurez-vous le zonage de l'intervention ?",
 a:"Reconnaissance à distance, définition d'une zone d'exclusion, d'une zone contrôlée et d'une zone de soutien, alerte CODIS, demande de moyens spécialisés (CMIR)."},
{theme:"Sécurité civile", acro:"ORSEC", q:"Qu'est-ce que le plan ORSEC ?",
 a:"Dispositif national d'Organisation de la Réponse de SÉcurité Civile, décliné aux niveaux zonal, départemental/territorial et communal, reposant sur des dispositions générales et des dispositions spécifiques à certains risques."},
{theme:"Sécurité civile", acro:"CODIS", q:"Vous êtes adjoint au chef de centre, le RI du SDIS interdit l'alcool dans l'enceinte de ses bâtiments, le caporal « X » vient vous prévenir qu'il a vu des bouteilles de digestifs dans le casier du Sergent B. Que décidez-vous ou quelle décision préconisez-vous et pourquoi ?",
 a:"Vérifier discrètement et factuellement les éléments avant toute décision, rappeler le règlement intérieur, en référer à votre hiérarchie (chef de centre), engager si nécessaire une procédure proportionnée sans stigmatiser prématurément l'agent, dans le respect du contradictoire."},

{theme:"Gestion opérationnelle", acro:"MGO", q:"Pouvez-vous citer les étapes de la Marche Générale des Opérations ?",
 a:"Reconnaissance, sauvetages/mises en sécurité, établissements, ventilation, extinction (les 5 idées maîtresses de la MGO)."},
{theme:"Gestion opérationnelle", acro:"USAR", q:"Que signifie USAR et quelles sont les manoeuvres de l'équipier ?",
 a:"Urban Search And Rescue : recherche et sauvetage en milieu urbain effondré. L'équipier participe au repérage des victimes, à l'étaiement léger et aux techniques de dégagement sous la coordination d'un spécialiste USAR."},
{theme:"Gestion opérationnelle", acro:"ARI", q:"Quelles règles de sécurité respectez-vous lors de l'engagement en ARI de vos équipes ?",
 a:"Vérification avant engagement, binôme obligatoire, gestion de l'autonomie (règle des tiers), maintien du contact radio, respect du seuil de repli."},
{theme:"Gestion opérationnelle", acro:"GOC", q:"Vous venez d'obtenir votre GOC 4 : quelles nouvelles responsabilités cela vous confère-t-il en tant que chef de colonne ?",
 a:"Le GOC 4 permet de commander des dispositifs rassemblant environ 6 à 20 véhicules et 20 à 80 sapeurs-pompiers, au niveau chef de colonne, avec des fonctions élargies dans un PC de niveau supérieur."},
{theme:"Gestion opérationnelle", acro:"CDG", q:"Vous êtes chef de groupe et arrivez en renfort sur un feu déjà engagé par un chef d'agrès : quel est votre premier réflexe ?",
 a:"Se présenter au COS déjà en place, recevoir un compte-rendu de situation et une mission, agir dans ce cadre sans se substituer au commandement établi."},

{theme:"Management", acro:"CMDT", q:"Deux agents sous votre autorité entrent en conflit ouvert pendant une garde : comment intervenez-vous ?",
 a:"Mise en situation : écouter chaque partie séparément, cadrer factuellement sans prendre parti à chaud, rappeler les règles, agir avec proportionnalité, rendre compte à la hiérarchie, assurer un suivi."},
{theme:"Management", acro:"RETEX", q:"Après une intervention difficile, comment organisez-vous le retour d'expérience avec votre équipe ?",
 a:"Débriefing à chaud puis analyse à froid structurée, identification des points positifs et axes d'amélioration sans recherche de faute individuelle, diffusion des enseignements."},
{theme:"Management", acro:"LÉGIT", q:"Comment articulez-vous autorité hiérarchique et légitimité opérationnelle face à des sapeurs-pompiers plus expérimentés que vous ?",
 a:"Mise en situation : s'appuyer sur l'exemplarité, la compétence technique et l'écoute pour construire une légitimité qui complète l'autorité de grade, sans imposer par le seul statut."},
{theme:"Management", acro:"DÉCIS", q:"Vous devez faire appliquer une décision impopulaire prise par votre hiérarchie : comment la présentez-vous à votre équipe ?",
 a:"Mise en situation : expliquer le sens de la décision, assumer votre rôle de relais sans la désavouer publiquement, rester à l'écoute des réactions, accompagner sa mise en oeuvre."},
{theme:"Management", acro:"STRESS", q:"Un de vos agents montre des signes de stress opérationnel post-intervention : quelle est votre posture d'officier ?",
 a:"Mise en situation : observer sans minimiser, proposer un temps d'échange, orienter vers le soutien psychologique du SDIS si besoin, assurer un suivi discret dans la durée."},

{theme:"Prévention incendie", acro:"ERP", q:"Quelles catégories d'ERP connaissez-vous et en quoi cela influence-t-il votre analyse de risque ?",
 a:"Catégories 1re à 5e selon l'effectif, types selon l'activité (lettres) ; cela détermine le niveau d'exigence réglementaire et la fréquence des visites de commission de sécurité."},
{theme:"Prévention incendie", acro:"AP2/PRV2", q:"Quelle différence faites-vous entre les qualifications AP2 et PRV2 pour siéger en commission de sécurité ?",
 a:"Unités de valeur de prévention distinctes permettant de représenter le SIS en commission de sécurité avec voix consultative ; la correspondance exacte est à vérifier auprès de votre service formation (évolutions du schéma national)."},
{theme:"Prévention incendie", acro:"IGH", q:"Que veut dire IGH ? En tant que chef de groupe intervenant sur un IGH, quelles seraient vos premières préoccupations pour vos équipes ?",
 a:"Immeuble de Grande Hauteur. Priorités : compartimentage, désenfumage, colonnes sèches/humides, ascenseurs pompiers, poste de sécurité, coordination avec le service de sécurité incendie de l'immeuble (SSIAP)."},

{theme:"Éthique & posture", acro:"SERV PUB", q:"Comment définissez-vous, dans vos propres mots, le sens du service public appliqué à votre métier ?",
 a:"Réponse personnelle attendue : le jury évalue votre authenticité, pas une définition apprise par coeur."},
{theme:"Éthique & posture", acro:"EXEMPL", q:"Vous constatez qu'un collègue gradé ne respecte pas une consigne de sécurité devant les jeunes recrues : comment réagissez-vous ?",
 a:"Mise en situation : intervenir sur le moment si le danger est immédiat, échanger ensuite en aparté avec le collègue, rappeler l'exemplarité attendue devant les recrues, en référer à la hiérarchie si la situation persiste."},
{theme:"Éthique & posture", acro:"ENGAGE", q:"Qu'est-ce qui, selon vous, distingue l'engagement d'un sapeur-pompier professionnel de celui d'un simple salarié ?",
 a:"Réponse personnelle attendue : notion de risque assumé, de disponibilité et de sens du collectif au service d'autrui."},
{theme:"Éthique & posture", acro:"TRANSM", q:"Comment transmettez-vous les valeurs du métier à une jeune recrue que vous encadrez ?",
 a:"Réponse personnelle attendue : par l'exemple au quotidien, l'explication du sens des règles, l'accompagnement individualisé et le retour d'expérience partagé."},
];

// ===================== CULTURE TERRITORIALE — QUESTIONS CIBLÉES (35) =====================
const TERRITORIALE = [
{theme:"Culture terr. · Préfet", acro:"NOMIN", q:"Qui nomme le préfet et sur proposition de qui ?",
 a:"Le préfet est nommé par décret du Président de la République, pris en Conseil des ministres, sur proposition du Premier ministre et du ministre de l'Intérieur."},
{theme:"Culture terr. · Préfet", acro:"ART.72", q:"Quelle est la mission constitutionnelle du préfet selon l'article 72 de la Constitution ?",
 a:"Il a la charge des intérêts nationaux, du contrôle administratif (contrôle de légalité) et du respect des lois dans les collectivités territoriales."},
{theme:"Culture terr. · Préfet", acro:"DSIL", q:"Le préfet peut-il bénéficier d'une délégation de signature pour la DSIL ?",
 a:"Oui, le préfet de département peut bénéficier d'une délégation de signature pour les décisions d'attribution de la Dotation de Soutien à l'Investissement Local."},
{theme:"Culture terr. · Préfet de zone", acro:"ZONE", q:"Qu'est-ce qu'un préfet de zone de défense et de sécurité ?",
 a:"Un préfet, généralement celui de la région siège de la zone, chargé de la coordination interdépartementale de la sécurité civile, de la défense et de l'ordre public à l'échelle d'un grand quart du territoire."},
{theme:"Culture terr. · Préfet de zone", acro:"7 ZONES", q:"Combien de zones de défense et de sécurité compte la France métropolitaine ?",
 a:"Sept zones en métropole (auxquelles s'ajoutent des zones spécifiques outre-mer)."},
{theme:"Culture terr. · Préfet de zone", acro:"CRISE", q:"Quel est le rôle du préfet de zone en cas de crise dépassant le cadre départemental ?",
 a:"Il coordonne les moyens entre départements, active le niveau zonal du dispositif ORSEC et assure le lien avec le niveau national."},
{theme:"Culture terr. · Préfet", acro:"P.MARIT", q:"Qu'est-ce que le préfet maritime et en quoi son rôle diffère-t-il du préfet de zone terrestre ?",
 a:"Autorité de l'État en mer, il exerce des pouvoirs de police, de sécurité et de défense sur le domaine maritime, distincts des attributions territoriales classiques du préfet de zone terrestre."},
{theme:"Culture terr. · Préfet", acro:"PPNG", q:"Quelles sont les missions prioritaires réaffirmées par le plan préfectures nouvelle génération ?",
 a:"Gestion des crises, lutte contre la fraude documentaire, expertise juridique, contrôle de légalité, et coordination territoriale des politiques publiques."},

{theme:"Culture terr. · Maire", acro:"ÉTATCIV", q:"En tant qu'officier d'état civil, sous l'autorité de qui le maire est-il placé ?",
 a:"Sous l'autorité du procureur de la République près le tribunal judiciaire dont dépend la commune."},
{theme:"Culture terr. · Maire", acro:"MISSIONS", q:"Quelles missions le maire exerce-t-il en tant qu'officier d'état civil ?",
 a:"Célébration des mariages, enregistrement des naissances et décès, tenue des registres, délivrance de copies et extraits, enregistrement des PACS et des changements de prénom/nom."},
{theme:"Culture terr. · Maire", acro:"PACS", q:"Depuis quelle réforme le maire enregistre-t-il les PACS ?",
 a:"Depuis la loi de modernisation de la justice du XXIe siècle du 18 novembre 2016."},
{theme:"Culture terr. · Maire", acro:"POL.JUD", q:"Le maire dispose-t-il de pouvoirs de police judiciaire ?",
 a:"Oui, en tant qu'officier de police judiciaire sous le contrôle du procureur, mais cette compétence est peu exercée en pratique en raison de la présence de la police nationale ou de la gendarmerie."},
{theme:"Culture terr. · Maire", acro:"DÉDOUBL", q:"Qu'est-ce que le \"dédoublement fonctionnel\" du maire ?",
 a:"Le fait d'exercer à la fois les fonctions d'élu local (exécutif de la commune) et celles de représentant de l'État sur le territoire communal."},
{theme:"Culture terr. · Maire", acro:"S/PRÉFET", q:"Quelles tâches administratives le maire exerce-t-il sous l'autorité du préfet ?",
 a:"Publication et exécution des lois et règlements, organisation des élections, délivrance de certains certificats et autorisations (ex. licences de débit de boissons)."},
{theme:"Culture terr. · Maire", acro:"POL.SPÉ", q:"Quels pouvoirs de police spéciale le maire détient-il ?",
 a:"Par exemple en matière de publicité et d'enseignes, ou pour délivrer certaines autorisations comme les licences de débit de boissons."},
{theme:"Culture terr. · Maire", acro:"CNI", q:"Depuis quand certaines communes seulement délivrent-elles les cartes nationales d'identité ?",
 a:"Depuis 2017 (décret du 28 octobre 2016), comme c'était déjà le cas pour les passeports."},

{theme:"Culture terr. · Sous-préfet", acro:"ARROND", q:"Quel est le rôle du sous-préfet dans l'arrondissement ?",
 a:"Délégué du préfet, il veille au respect des lois, concourt au maintien de l'ordre public, anime l'action des services de l'État et conseille les collectivités locales."},
{theme:"Culture terr. · Sous-préfet", acro:"233", q:"Combien de sous-préfectures compte la France ?",
 a:"Environ 233 sous-préfectures."},

{theme:"Culture terr. · Déconcentration", acro:"CHARTE15", q:"Qu'apporte la charte de la déconcentration de mai 2015 ?",
 a:"Elle relance la déconcentration autour de quatre axes : définition générale, principe de modularité, principes opérationnels (dont la déconcentration budgétaire), et création d'instances de dialogue comme la CNATE."},
{theme:"Culture terr. · Déconcentration", acro:"ATR 1992", q:"Quel principe la loi ATR du 6 février 1992 a-t-elle consacré ?",
 a:"Le principe de subsidiarité dans la répartition des compétences entre administrations centrales et services déconcentrés."},
{theme:"Culture terr. · Déconcentration", acro:"RGPP", q:"Qu'est-ce que le RGPP et quel a été son impact sur l'organisation territoriale de l'État ?",
 a:"La Révision Générale des Politiques Publiques (2007), visant à réduire dépenses et effectifs de l'État, à l'origine de la réforme RéATE de 2010."},
{theme:"Culture terr. · Déconcentration", acro:"DREAL", q:"Qu'est-ce que la DREAL ?",
 a:"Direction Régionale de l'Environnement, de l'Aménagement et du Logement, structure régionale interministérielle issue de la RéATE."},
{theme:"Culture terr. · Déconcentration", acro:"DDI", q:"Qu'est-ce qu'une direction départementale interministérielle (DDI) ?",
 a:"Une structure départementale regroupant plusieurs anciennes directions au sein d'un même service, comme la DDT ou la DDETS."},

{theme:"Culture terr. · Décentralisation", acro:"4 CRIT", q:"Quels sont les 4 éléments constitutifs de la décentralisation ?",
 a:"L'existence de personnes morales distinctes de l'État, la présence d'organes élus, la reconnaissance d'affaires locales, et le maintien d'un contrôle administratif."},
{theme:"Culture terr. · Décentralisation", acro:"LIB.ADM", q:"Quelle est la différence entre libre administration et décentralisation ?",
 a:"La libre administration est un principe constitutionnel plus large englobant tous les rapports des collectivités avec l'État et les tiers ; la décentralisation ne concerne que les relations entre l'État et les collectivités."},
{theme:"Culture terr. · Décentralisation", acro:"ACTE I", q:"Qu'est-ce que l'acte I de la décentralisation (1982) ?",
 a:"La loi du 2 mars 1982 qui supprime la tutelle de l'État, transfère l'exécutif départemental et régional à un président élu, et fait de la région une collectivité territoriale."},
{theme:"Culture terr. · Décentralisation", acro:"ACTE II", q:"Qu'est-ce que l'acte II de la décentralisation (2003) ?",
 a:"La révision constitutionnelle du 28 mars 2003 qui consacre l'organisation décentralisée de la République, le principe de subsidiarité et l'autonomie financière des collectivités."},
{theme:"Culture terr. · Décentralisation", acro:"MAPTAM", q:"Qu'apporte la loi MAPTAM du 27 janvier 2014 ?",
 a:"La clarification des compétences par la logique de collectivité chef de file, et l'affirmation des métropoles (Grand Paris, Lyon, Aix-Marseille-Provence)."},
{theme:"Culture terr. · Décentralisation", acro:"NOTRe", q:"Quels sont les principaux apports de la loi NOTRe du 7 août 2015 ?",
 a:"Suppression de la clause de compétence générale des départements et régions, renforcement des compétences régionales (économie, transports), relèvement du seuil intercommunal."},
{theme:"Culture terr. · Décentralisation", acro:"3DS", q:"Qu'est-ce que la loi 3DS du 21 février 2022 ?",
 a:"Une loi de différenciation, décentralisation, déconcentration et simplification, renforçant notamment le rôle du préfet et l'accompagnement des collectivités."},
{theme:"Culture terr. · Décentralisation", acro:"STATUT", q:"Quelles sont les collectivités à statut particulier en France ?",
 a:"La collectivité de Corse, la Métropole de Lyon et la Ville de Paris."},

{theme:"Culture terr. · Outre-mer", acro:"DOM/COM", q:"Quelle est la différence entre DOM et COM ?",
 a:"Les DOM (article 73 C) suivent le principe d'identité législative (les lois s'y appliquent de plein droit) ; les COM (article 74 C) suivent le principe de spécialité législative, avec un statut propre défini par une loi organique."},
{theme:"Culture terr. · Outre-mer", acro:"N-CALÉD", q:"Quel statut particulier a la Nouvelle-Calédonie ?",
 a:"Elle bénéficie de lois de pays à valeur législative (titre XIII de la Constitution) sans avoir accédé à la pleine souveraineté après trois référendums négatifs."},

{theme:"Culture terr. · Services publics", acro:"FR.SERV", q:"Qu'est-ce que le réseau France Services ?",
 a:"Un réseau de guichets uniques regroupant plusieurs opérateurs publics (La Poste, CAF, France Travail...) pour rapprocher les démarches administratives des citoyens."},
{theme:"Culture terr. · Services publics", acro:"ANCT", q:"Qu'est-ce que l'Agence Nationale de la Cohésion des Territoires (ANCT) ?",
 a:"Une agence de l'État créée en 2019, chargée de soutenir l'ingénierie des projets locaux, en particulier dans les territoires les plus fragiles."},
];

{theme:"QCM Culture terr.", acro:"QCM 15", q:"QCM — À quoi sert le Comité de l'Administration Régionale (CAR) ?\nA. Développement touristique régional\nB. Formation continue et apprentissage\nC. Définition des orientations stratégiques de l'État en région",

{theme:"QCM Culture terr.", acro:"QCM 21", q:"QCM — Est-il vrai qu'on a divisé par deux le nombre de fonctionnaires de l'État ?\nA. Oui, c'est un élément clef d'économies publiques\nB. Non, division par deux des 3 fonctions publiques\nC. Non, réduction d'effectifs mais pas division par deux",

{theme:"QCM Culture terr.", acro:"QCM 24", q:"QCM — La décentralisation provoque-t-elle des ruptures d'égalité entre citoyens ?\nA. Non, ce serait contraire à la Constitution\nB. Oui, par définition",

{theme:"QCM Culture terr.", acro:"QCM 25", q:"QCM — Égalité et uniformité sont-elles des termes synonymes en décentralisation ?\nA. Oui\nB. Non",

{theme:"QCM Culture terr.", acro:"QCM 27", q:"QCM — Quel sens a l'expression « discrimination positive » ?\nA. Politique préférentielle pour lutter contre des inégalités préexistantes\nB. Action en faveur des quartiers aisés\nC. Critique de l'injustice sociale",

{theme:"QCM Culture terr.", acro:"QCM 28", q:"QCM — La naissance de la décentralisation date-t-elle de 1982 ?\nA. Oui, d'où le nom d'acte I\nB. Non, un système partiellement décentralisé existait bien avant\nC. Pas exactement, il a fallu attendre 1986",

{theme:"QCM Culture terr.", acro:"QCM 32", q:"QCM — Combien de catégories de collectivités territoriales existe-t-il aujourd'hui ?\nA. 5 : communes, départements, régions, TOM et structures intercommunales\nB. 5 : communes, conseils départementaux, conseils régionaux, COM et Nouvelle-Calédonie\nC. 5 : communes, départements, régions, collectivités à statut particulier et COM",

{theme:"QCM Culture terr.", acro:"QCM 33", q:"QCM — Quels organes structurent aujourd'hui les collectivités territoriales ?\nA. Un organe exécutif, un organe délibérant, et pour les régions un organe consultatif\nB. Un organe exécutif ou un organe délibérant\nC. Un organe exécutant et un organe collégial",

{theme:"QCM Culture terr.", acro:"QCM 34", q:"QCM — L'acte III de la décentralisation supprime-t-il les départements ?\nA. Oui, en raison de la métropole du Grand Paris\nB. Non\nC. Oui, mais juste en 1re couronne francilienne",
 a:"Réponse B. Les départements conservent leur vocation sociale et de solidarité territoriale, malgré des transferts de compétences vers les métropoles."},
{theme:"QCM Culture terr.", acro:"QCM 35", q:"QCM — Comment sont créées les métropoles de droit commun ?\nA. Par décret pour les EPCI à fiscalité propre de plus de 400 000 habitants dans une aire urbaine de plus de 650 000 habitants\nB. Par délibérations concordantes des communes concernées\nC. Par arrêté du préfet de région pour les EPCI de plus de 300 000 habitants",
 a:"Réponse A. Les métropoles de droit commun sont créées par décret, selon ces seuils démographiques fixés par la loi."},
];

const CARDS = [...POMPIER, ...TERRITORIALE, ...QCM];
const CATEGORIES = ["Tous", "Pompier", "Culture territoriale", "QCM"];

function categoryOf(card){
  if(QCM.includes(card)) return "QCM";
  if(TERRITORIALE.includes(card)) return "Culture territoriale";
  return "Pompier";
}

let activeCategory = "Tous";
let deck = [];
let drawnCount = 0;
let currentAnswer = "";
let poolTotal = CARDS.length;

function pool(){
  if(activeCategory === "Tous") return CARDS;
  return CARDS.filter(c => categoryOf(c) === activeCategory);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildFilterbar(){
  const bar = document.getElementById('filterbar');
  bar.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'filter-chip' + (cat === activeCategory ? ' active' : '');
    btn.textContent = cat;
    btn.addEventListener('click', ()=>{
      activeCategory = cat;
      buildFilterbar();
      resetDeck();
    });
    bar.appendChild(btn);
  });
}

function resetDeck(){
  const p = pool();
  poolTotal = p.length;
  deck = shuffle(p);
  drawnCount = 0;
  currentAnswer = "";
  updateMeter();
  const card = document.getElementById('card');
  card.classList.remove('flipped','drawing');
  document.getElementById('emptyMsg').style.display = 'none';
  document.getElementById('drawBtn').disabled = false;
  document.getElementById('drawBtn').textContent = 'Tirer une carte';
  document.getElementById('answerBtn').disabled = true;
  document.getElementById('answerBtn').textContent = 'Voir la réponse';
  document.getElementById('answerBox').style.display = 'none';
}

function updateMeter(){
  const remaining = deck.length;
  document.getElementById('meterLabel').textContent = remaining + ' carte' + (remaining>1?'s':'') + ' restante' + (remaining>1?'s':'') + ' / ' + poolTotal;
  document.getElementById('meterFill').style.width = (poolTotal ? (remaining/poolTotal*100) : 0) + '%';
}

function drawCard(){
  if(deck.length === 0) return;
  const card = document.getElementById('card');
  const data = deck.pop();
  drawnCount++;
  currentAnswer = data.a || "Pas de réponse disponible pour cette carte.";

  const cat = categoryOf(data);
  const themeTag = document.getElementById('themeTag');
  const acroSeal = document.getElementById('acroSeal');
  themeTag.textContent = data.theme;
  themeTag.className = 'theme-tag' + (cat === 'QCM' ? ' qcm' : (cat === 'Culture territoriale' ? ' terr' : ''));
  acroSeal.className = 'acro-seal' + (cat !== 'Pompier' ? ' terr' : '');

  document.getElementById('acroTxt').textContent = data.acro;
  document.getElementById('questionTxt').textContent = data.q;
  document.getElementById('cardNo').textContent = String(drawnCount).padStart(2,'0') + '/' + poolTotal;

  card.classList.remove('flipped');
  void card.offsetWidth;
  card.classList.add('drawing');
  setTimeout(()=>{ card.classList.add('flipped'); }, 20);

  document.getElementById('answerBtn').disabled = false;
  document.getElementById('answerBtn').textContent = 'Voir la réponse';
  document.getElementById('answerBox').style.display = 'none';

  updateMeter();
  if(deck.length === 0){
    document.getElementById('drawBtn').disabled = true;
    document.getElementById('emptyMsg').style.display = 'block';
  }
}

function toggleAnswer(){
  const box = document.getElementById('answerBox');
  const btn = document.getElementById('answerBtn');
  if(!currentAnswer) return;
  if(box.style.display === 'none'){
    document.getElementById('answerText').textContent = currentAnswer;
    box.style.display = 'block';
    btn.textContent = 'Masquer la réponse';
  } else {
    box.style.display = 'none';
    btn.textContent = 'Voir la réponse';
  }
}

document.getElementById('card').addEventListener('click', ()=>{
  const card = document.getElementById('card');
  if(!card.classList.contains('flipped') && deck.length > 0){
    drawCard();
  }
});
document.getElementById('drawBtn').addEventListener('click', drawCard);
document.getElementById('resetBtn').addEventListener('click', resetDeck);
document.getElementById('answerBtn').addEventListener('click', toggleAnswer);

function spawnEmbers(){
  const container = document.getElementById('embers');
  const count = 22;
  for(let i=0;i<count;i++){
    const e = document.createElement('div');
    e.className = 'ember-particle';
    const size = 2 + Math.random()*3;
    e.style.width = size+'px';
    e.style.height = size+'px';
    e.style.left = Math.random()*100 + 'vw';
    e.style.setProperty('--drift', (Math.random()*60-30)+'px');
    const dur = 6 + Math.random()*8;
    e.style.animationDuration = dur+'s';
    e.style.animationDelay = (Math.random()*dur)+'s';
    container.appendChild(e);
  }
}
spawnEmbers();
buildFilterbar();
resetDeck();
</script>

</body>
</html>
